name: CISB-Guard CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install LLVM 18 & Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake \
          ninja-build \
          libclang-18-dev \
          libclang-cpp18-dev
        python3 -m pip install --break-system-packages matplotlib
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
        sudo update-alternatives --install /usr/bin/opt opt /usr/bin/opt-18 100
        sudo update-alternatives --install /usr/bin/llvm-config llvm-config /usr/bin/llvm-config-18 100

    - name: Build LLVM Pass Plugin & Clang AST Tool
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
          -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang
        cmake --build build

    - name: Make Wrapper Executable
      run: chmod +x bin/cisb-guard-cc bin/cisb_guard_cc.py

    - name: Run End-to-End Verification Test Suite
      run: python3 tests/verify_all.py
